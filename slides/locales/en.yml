cover:
  title: PyVista on WebAssembly
  subtitle: Running PyVista entirely in the browser — no server required
  tagline: No server, no install, no data leaving your machine
  event: PyCon JP 2026
  speaker: Tetsuo Koyama

agenda:
  title: Agenda
  subtitle: A four-part tour, from the why to the how
  i1t: PyVista and WASM overview
  i1d: Why run 3D visualization in the browser
  i2t: Technical stack & implementation
  i2d: vtk-wasm, TypeScript glue, PyVista API
  i3t: Live demo in browser
  i3d: PyVista running with no server
  i4t: Performance & limitations
  i4d: What works today, what does not yet
  speaker_title: Speaker
  speaker_subtitle: PyVista contributor and pyvista-wasm co-maintainer
  speaker_name: Tetsuo Koyama
  speaker_i1: "PyVista contributor — bug fixes and feature PRs"
  speaker_i2: pyvista-wasm co-maintainer
  speaker_i3: "SciPy Conference 2022–2025 — MyST, PyVista, GeoVista sprints"
  speaker_i4: SciPyData Japan 2025 co-organizer
  speaker_i5: PyCon JP speaker and organizer

pyvista:
  title: What is PyVista?
  subtitle: "30 years of VTK's 3D power — made Pythonic"
  i1t: Built on VTK
  i1d: "Kitware's C++ visualization toolkit, 30+ years of development since 1993"
  i2t: Pythonic API
  i2d: "wraps VTK's powerful but verbose C++ core in a few intuitive lines"
  i3t: De facto standard
  i3d: medical imaging, CAE, geoscience, and meteorology
  i4t: Rich ecosystem
  i4d: ITK, NumPy, and SciPy
  mesh_caption_pre: "A triangulated 3D mesh, rendered by PyVista —"
  mesh_caption_bold: drag to rotate it

problem:
  title: The Problem
  subtitle: Sharing 3D results on the web still means running a server
  col_issue: Issue
  col_detail: Detail
  i1t: Three.js is not enough
  i1d: the go-to browser 3D library has no direct path to render physics and simulation results
  i2t: SSR needs a server
  i2d: server-side rendering fills the gap, but someone has to build and maintain a dedicated visualization server
  i3t: Cost
  i3d: standing up and operating that infrastructure is an ongoing expense
  i4t: Security risk
  i4d: "confidential simulation data has to leave the analyst's machine and travel to the server"
  conc_pre: These barriers make it hard to share analysis results
  conc_bold: quickly and securely
  conc_post: — what if the browser could do it all?

why_wasm:
  title: Why WASM?
  subtitle: Browser-complete sequence diagram
  i1t: Nothing is sent anywhere
  i1d: WebAssembly runs the whole visualization pipeline in the browser, so the round trip to a rendering server disappears
  i2t: Data never leaves the machine
  i2d: confidential simulation results stay client-side, so there is no transfer to secure in the first place
  i3t: No infrastructure to stand up
  i3d: no visualization server to provision, scale, or pay for month after month
  i4t: Where this came from
  i4d_pre: "a physics simulation project asked for one thing:"
  i4d_italic: drop the analyzed mesh into the browser and see it
  i5t: Demos anywhere
  i5d: show results in the field or at a client site with a browser and nothing else
  conc_pre: A URL becomes the whole delivery mechanism —
  conc_bold: so how do we get PyVista in there?

arch:
  title: "Architecture: SSR vs Wasm"
  subtitle: Sequence diagram — SSR vs Wasm
  conc_pre: "The round-trip is gone entirely —"
  conc_bold: rendering happens where the data already is

vtk_wasm:
  title: What is vtk.wasm?
  subtitle: "30 years of VTK's capability — now running in the browser"
  i1t: Built by Kitware
  i1d: the C++ Visualization Toolkit, maintained since 1993, 30+ years of accumulated capability
  i2t: Field-proven
  i2d: medical imaging, CAE, and geoscience run on VTK every day
  i3t: Hundreds of filters
  i3d: point clouds, meshes, and volume data out of the box
  i4t: OpenGL/Vulkan renderers
  i4d: production-grade GPU pipelines
  i5t: Rich ecosystem
  i5d: PyVista (Python wrapper), ITK (medical imaging), and the NumPy/SciPy scientific stack
  i6t: Wasm port
  i6d: all of these capabilities now run without a server, entirely in the browser
  i7t: Demos anywhere
  i7d: particularly significant for field demos and client-site presentations
  conc_pre: "VTK's full power in a URL —"
  conc_bold: so how do we glue it to PyVista?

history:
  title: Wasm Build History & Current Status
  subtitle: VTK.wasm Sample
  y1: "2018"
  y1l: Experimental
  y1d: Emscripten builds began — early proof-of-concept bringing VTK to the browser
  y2: "2021"
  y2l: Official
  y2d_pre: Integrated into the official build pipeline;
  y2d_bold1: vtk.wasm
  y2d_mid: published on npm — distinct from
  y2d_bold2: vtk.js
  y2d_post: "(the JavaScript reimplementation)"
  y3: "2023–2024"
  y3l: WebGPU
  y3d: WebGPU backend support progressed — higher rendering performance and GPU compute compared to WebGL
  i1t: Runtime switching
  i1d: current packages can switch between WebGL and WebGPU at runtime
  i2t: Automatic fallback
  i2d: gracefully degrades based on browser support, a design still progressing
  conc_pre: From experiment to production-ready —
  conc_bold: the technology is maturing steadily

demos:
  title: VTK.wasm Demos
  subtitle: Running in your browser, right now

caps:
  title: Capabilities & Current Limitations
  subtitle: vtk.wasm can do a lot in the browser today — and its edges are known
  caps_title: Capabilities
  caps_subtitle: The full VTK pipeline, mesh loading, interactive camera, and Python — all in the browser
  lim_title: Current Limitations
  lim_subtitle: Real limitations exist — but ~100K elements run at practical interactive speed
  caps_label: Capabilities
  i1t: VTK filter pipeline
  i1d: full filter execution runs entirely in the browser
  i2t: Mesh loading
  i2d: VTP, VTU, and STL formats load directly client-side
  i3t: Interactive camera
  i3d: rotate, pan, and zoom with direct manipulation
  i4t: Python integration
  i4d: the PyVista API drives it all from Python
  lim_label: Limitations
  i5t: Module size
  i5d: 30–50 MB, 10–15 MB after gzip
  i6t: COOP/COEP headers
  i6d: multi-threading requires cross-origin isolation
  i7t: WebGPU flags
  i7d: may need experimental flags in some browsers
  i8t: Initial load
  i8d: several seconds to 10+ seconds before first render
  conc_pre: Large-scale meshes still have constraints — but
  conc_bold: ~100K elements run at practical interactive speed

build_dist:
  title: Build & Distribution Mechanism
  subtitle_pre: A hours-long Emscripten build collapses to
  subtitle_post: — the binary streams from CDN at runtime
  build_title: How vtk-wasm is Built
  build_subtitle: VTK's C++ compiled to WebAssembly — consumers just npm install
  dist_title: Package Distribution Sequence Diagram
  dist_subtitle: Sequence diagram — how the package is distributed
  build_label: Build
  i1t: Emscripten
  i1d: "VTK's C++ compiled to WebAssembly; the build takes hours, but consumers just"
  i2t: "{'@'}kitware/vtk-wasm"
  i2d: the JavaScript binding npm package that exposes the VTK API to the browser
  dist_label: Distribution
  first_load: "First load is ~12–15 MB (gzip) — pair with a spinner and lazy loading (Intersection Observer)"

pipeline:
  title: VTK Emscripten Build Pipeline
  subtitle: C++ compiled to WebAssembly once — consumers just npm install and add two Vite lines
  i1t: Emscripten
  i1d: "VTK's entire C++ codebase compiled to WebAssembly, bringing 30 years of capability into the browser"
  i2t: Heavy build, light consumption
  i2d: the build itself takes hours, but consumers simply
  i3t: Tarball at runtime
  i3d: the WASM binary streams from CDN as a tarball, not bundled into the JS package
  conc_pre: One Vite config unlocks it all —
  conc_bold: two lines stand between you and browser-native VTK
  config_label: vite.config.js
  i4t: "build.target: 'esnext'"
  i4d: vtk-wasm relies on modern JS features that require next-generation build targets
  i5t: optimizeDeps.exclude
  i5d: Vite must not pre-bundle the WASM package; it loads asynchronously at runtime

pyodide:
  title: Pyodide + PyVista in the Browser
  subtitle: Architecture diagram — Pyodide + PyVista layered in the browser
  i1t: Pyodide
  i1d: CPython compiled to WebAssembly, running the real CPython interpreter inside the browser
  i2t: PyVista
  i2d: a Pythonic wrapper over VTK, the same API scientists already use on the desktop
  i3t: The combination
  i3d: write Python in the browser, visualize 3D meshes on the same page, zero backend
  i4t: pyvista-wasm
  i4d: bridges the gap with a PyVista-like API built on top of vtk-wasm
  conc_pre: TypeScript is the glue —
  conc_bold: loading vtk-wasm and bridging C++ VTK bindings to the Python-facing API
  arch_label: Layered architecture
  i5t: Glue layer
  i5d: TypeScript loads the vtk-wasm module and exposes its VTK classes to Python
  i6t: Runtime fallback
  i6d_pre: when
  i6d_post: ", mesh fetches use XMLHttpRequest instead of urllib"

rendering:
  title: WebGL / WebGPU Rendering Integration
  subtitle: Two render backends, one runtime — WebGL keeps it everywhere, WebGPU pushes it further
  webgl_label: WebGL · the baseline
  i1t: Universally supported
  i1d: available in every modern browser, the reliable render path that always works
  i2t: OpenGL ES heritage
  i2d: a mature, well-understood graphics API with years of tooling and driver support
  i3t: Safe default
  i3d: guarantees a working visualization even on older or conservative browsers
  webgpu_label: WebGPU · the next step
  i4t: Higher performance
  i4d: lower driver overhead and closer-to-the-metal access than WebGL
  i5t: GPU compute
  i5d: exposes general-purpose compute shaders, not just the fixed rendering pipeline
  i6t: Experimental in places
  i6d: some browsers still require flags; 2023–2024 brought significant backend progress
  i7t: Runtime switching
  i7d: current packages select between WebGL and WebGPU at runtime, with automatic fallback when WebGPU is unavailable

dev_ci:
  title: Development & CI Challenges
  subtitle: Three pitfalls every vtk.wasm integration hits — and the fix for each
  i1t: async/await everywhere
  i1d1: returns a Promise, so every VTK object operation must be
  i1d2: "; forgetting"
  i1d3: touches objects before WASM loads and errors out
  i2t: SharedArrayBuffer
  i2d1: parallel processing filters need it, so the server must return
  i2d2: and
  conc_pre: Cross-origin isolation is the gate for multi-threading —
  conc_bold: without those headers, threaded filters silently break
  config_label: vite.config.js
  i3t: vite-plugin-cross-origin-isolation
  i3d: injects the COOP/COEP headers for you in dev and preview
  i4t: CORS on the tarball URL
  i4d: fetches cross-origin, so the CDN must send CORS headers
  i5t: jsDelivr over GitLab
  i5d: "Kitware's GitLab direct URL is slow in Asia; jsDelivr's multi-CDN edge cache is both CORS-enabled and faster"

sphere:
  title: "Minimal Sample: Sphere Rendering"
  subtitle: Four VTK objects from geometry to pixels — the smallest complete pipeline
  pipeline_label: Pipeline
  i1t: vtkSphereSource
  i1d: generates sphere geometry as
  i2t: vtkPolyDataMapper
  i2d: maps polygonal data to graphics primitives
  i3t: vtkActor
  i3d: "holds the sphere's position, properties, and mapper"
  i4t: vtkRenderer
  i4d: renders the actor into the viewport
  i5t: StackBlitz
  i5d: edit parameters in the browser and watch the preview update in real time
  code_label: sphere.js
  i6t: async/await
  i6d: returns a Promise; all VTK operations must be awaited
  i7t: COOP/COEP
  i7d: requires cross-origin isolation headers
  i8t: CORS-enabled CDN
  i8d: the tarball URL must allow CORS; prefer jsDelivr

demo_jl:
  title: "Demo: JupyterLite"
  subtitle: A browser-only Jupyter environment — write Python, render 3D meshes, share by URL
  i1t: JupyterLite
  i1d: a browser-only Jupyter environment; no installation needed, 3D meshes display interactively in notebooks
  i2t: pv.Sphere() and pv.read()
  i2d: pre-prepared notebooks let you start rendering with a single cell
  i3t: Run a cell, see it render
  i3d: running a cell launches the 3D viewer right in the notebook
  i4t: No local setup
  i4d: the ideal entry point to experience vtk.wasm rendering quality without installing anything
  i5t: Static hosting
  i5d: deployable to GitHub Pages or any static host, no server required
  conc_pre: Share by URL —
  conc_bold: a reproducible analysis environment in one click
  code_label: intro.ipynb
  demo_label: Live demo

demo_marimo:
  title: "Demo: marimo"
  subtitle: A reactive Python notebook — change a slider, the mesh redraws instantly, no rerun button needed
  i1t: Reactive notebook
  i1d: marimo runs entirely in the browser; when a cell value changes, dependent cells auto-rerun
  i2t: Real-time mesh updates
  i2d: slider values trigger instant redraw; change mesh color and viewpoint interactively
  i3t: No rerun button
  i3d: unlike Jupyter, there is no manual rerun step; the dependency graph drives execution automatically
  i4t: Exploratory efficiency
  i4d: parameter sweeps become effortless, improving the pace of exploratory visualization work
  conc_pre: Share by URL —
  conc_bold: a reactive 3D exploration environment in one click
  demo_label: Live demo

demo_stlite:
  title: "Demo: stlite"
  subtitle: Streamlit in the browser — sliders, select boxes, and widgets driving 3D mesh rendering, no server needed
  i1t: Streamlit in the browser
  i1d: stlite runs Streamlit entirely client-side; no server, no install, share the app by URL
  i2t: Declarative widgets
  i2d: a few lines of slider and selectbox code build a full interactive UI around 3D mesh visualization
  i3t: Stanford Bunny demo
  i3d: pick from 8 colors via a select box and tune opacity 0–1 with a slider, watching the mesh update live
  i4t: Built for non-engineers
  i4d: "Streamlit's declarative UI plus pyvista-wasm rendering yields a server-less tool anyone can use"
  i5t: Complementary, not competing
  i5d: JupyterLite and marimo suit exploratory notebook visualization; stlite suits widget-based interactive apps
  conc_pre: Best for publishing —
  conc_bold: when you need an interactive app with widgets, stlite is the natural choice
  demo_label: Live demo

perf:
  title: "Performance: Native vs Wasm"
  subtitle: Initial load costs seconds — but once loaded, ~100K-element meshes run at practical interactive speed
  overhead_label: Wasm overhead
  i1t: Initial load
  i1d: several seconds to 10+ seconds before first render, as the WASM binary streams in from CDN
  i2t: Network transfer
  i2d: ~12–15 MB (gzip) downloaded on first load; cached thereafter by the browser
  i3t: Large-scale constraints
  i3d: mesh processing at native-desktop scale still has practical limits in the browser
  holds_label: Where it holds up
  i4t: Practical interactive speed
  i4d: once loaded, rotate, pan, and zoom feel responsive, matching the native experience
  i5t: ~100K elements
  i5d: meshes of this scale run at practical interactive speed, the sweet spot for analysis review
  i6t: Small-team review
  i6d: sufficient quality for sharing analysis results within a small team at the current stage
  conc_pre: PoC confirmed —
  conc_bold: a dedicated server is not needed to share analysis results

constraints:
  title: WASM Constraints & Workarounds
  subtitle: Four constraints the browser imposes — and the workaround that clears each one
  constraints_title: WASM Constraints
  constraints_subtitle: Four constraints the browser imposes
  workarounds_title: Workarounds
  workarounds_subtitle: Every constraint has a proven workaround — none block a working demo
  constraints_label: Constraints
  i1t: Module size
  i1d: 30–50 MB, 10–15 MB after gzip; a heavy first download
  i2t: COOP/COEP headers
  i2d1: requires cross-origin isolation, so the server must return
  i2d2: and
  i3t: WebGPU flags
  i3d: some browsers still require experimental flags to enable the WebGPU backend
  i4t: Initial load time
  i4d: several seconds to 10+ seconds before the first render appears
  workarounds_label: Workarounds
  i5t: Spinner & lazy loading
  i5d1: show a spinner and defer loading with
  i5d2: until the canvas enters the viewport
  i6t: vite-plugin-cross-origin-isolation
  i6d: injects the COOP/COEP headers for you in Vite dev and preview
  i7t: Automatic fallback to WebGL
  i7d: when WebGPU is unavailable, the runtime falls back to the universally supported WebGL backend
  i8t: Progress indicators
  i8d: pair lazy loading with progress bars so the user knows the module is streaming
  conc_pre: Every constraint has a proven workaround —
  conc_bold: none of them block a working demo

use_cases:
  title: Suitable & Unsuitable Use Cases
  subtitle: Use case diagram — where vtk.wasm shines today and where its edges are
  conc_pre: PoC confirmed —
  conc_bold: analysis results can be shared without a dedicated server

roadmap:
  title: Future Roadmap
  subtitle: WebGPU stabilization and Pyodide + PyVista maturity — the application range keeps widening
  milestones_label: Key milestones
  i1t: WebGPU stabilization
  i1d: as the backend matures, GPU compute will run entirely in the browser, beyond the fixed rendering pipeline
  i2t: Pyodide + PyVista maturity
  i2d: the integration is steadily maturing, enabling a seamless bridge to the Python ecosystem
  i3t: Runtime backend switching
  i3d: WebGL/WebGPU selection and automatic fallback keep improving as browser support grows
  matters_label: Why it matters
  i4t: 30 years of VTK in the browser
  i4d: a heritage maintained since 1993 is now reachable from a single URL
  i5t: Accessibility keeps expanding
  i5d: server-less delivery is steadily broadening who can use scientific visualization
  i6t: Broader applications ahead
  i6d: as WebGPU stabilizes, the practical application range is expected to widen further
  conc_pre: The technology is maturing steadily —
  conc_bold: the next chapter is browser-native GPU compute

