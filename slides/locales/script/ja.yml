---
# Authoritative locale for the speaker script (see ADR-0006).
# Add, remove, or rename keys here first, then mirror the structure in en.yml.
# Keys are keyed by slide number (s1 = first slide, s2 = second, ...), matching
# the slide order in slides/slides.md. The script is the spoken elaboration of
# each slide's <!-- Single message: ... --> takeaway comment (see issue #443).
#
# Character budget: 25-minute talk at ~300 chars/min ≈ 7,500 chars (see #475).
# Each entry is what the speaker actually says aloud for that slide, aligned
# with the English single-message takeaway in en.yml. The EN file stays terse
# (the canonical takeaway); this file carries the spoken narration.
# yamllint disable rule:line-length
script:
  s1: 皆さん、PyCon JP 2026にお集まりいただきありがとうございます。本日は「PyVista on WebAssembly」というテーマでお話しします。一言で言えば、PyVistaをサーバーなしで完全にブラウザ上で動かすという内容です。インストールもサーバーも不要で、データは皆さんのマシンから一歩も外に出しません。科学技術計算の結果を、URL一つで誰にでも見せられる世界。この30分で、その仕組みとデモ、そして実装の裏側までお見せします。最後には皆さんも手元で試せる状態になります。サーバーレスで3D可視化が動く意義を体感してください。それでは始めましょう。
  s2: トークは3つのパートで構成されています。まずPyVistaとWASMの概要、なぜブラウザで3D可視化を試みるのかをお話しします。次に技術スタックと実装、vtk-wasmとTypeScriptのグルー層、そしてPyVistaのAPIについて。最後にブラウザで動くライブデモをご覧いただきます。サムネイルをクリックすれば該当セクションへジャンプできますが、今日は順番に沿って進めます。各パートの最後で、これが皆さんの現場でどう役立つかも併せてお伝えします。デモはすべてライブで動かしますので、ぜひご自身でも試してみてください。まずは私の紹介から始めます。
  s3: 私について少し紹介させてください。小山哲央、AIエンジニアとして燈株式会社で働きつつ、PyVistaのメンテナーとSciPy Conferenceの座長を務めています。NumFOCUSの技術運営委員も兼ねています。3D可視化と科学技術計算、そしてオープンソース開発が活動の中心で、PyVistaのWASM対応はまさにその三本の矢が交わる場所です。普段の業務で3D可視化をWebで共有したいという要望に向き合ってきたからこそ分かる実践的な知見を、本日はお話しします。日本語と英語の両方でコミュニティに関わっています。それでは、本題のPyVistaに入ります。
  s4: まずPyVistaについてです。PyVistaは科学技術計算向けの3D可視化Pythonライブラリで、VTKというC++の可視化ツールキットをPythonicにラップしています。VTKはKitwareが1993年から30年以上開発を続ける、科学技術可視化のデファクトスタンダードです。医用画像、CAE、地球科学、気象学、こうした分野で毎日VTKが動いています。PyVistaはその強力だが冗長なC++コアを、直感的な数行のPythonコードで扱えるようにします。ITK、NumPy、SciPyといった豊富なエコシステムともシームレスに連携する点も強みです。デスクトップで動く同じコードが、この後お見せする通りブラウザでもそのまま動きます。これがPyVistaを選ぶ理由です。続いて、VTKがどれほど広く使われているかを見てみましょう。
  s5: PyVistaのエンジンであるVTKは、世界の科学技術計算において最も広く普及している可視化C++ライブラリです。こちらはawesome-vtk、VTKプロジェクトの厳選リストで、VTKが実際にどれほど広く使われているかを示しています。医用画像、CAE、地球科学が毎日VTKで動いているほか、ポイントクラウド、メッシュ、ボリュームデータを扱う数百のフィルター、OpenGLやVulkanの本番級GPUパイプライン、PyVistaやITK、NumPy/SciPyといった豊富なエコシステムがあります。これほど広く使われているVTKですが、Web上でその結果を共有するのは今でもネックになります。
  s6: しかし、Web上で3Dの計算結果を共有するのは、今でもサーバーの用意がネックになります。まずThree.jsは科学技術計算結果をレンダリングするには機能不足です。SSR、サーバーサイドレンダリングを使うには専用の可視化サーバーを構築し維持する必要があり、時間的コストがかかります。インフラの構築と運用は継続的な出費でもあります。さらに、機密のシミュレーションデータが分析者のマシンからサーバーへ送信されるというセキュリティリスクも生じます。これら4つの障壁が、迅速かつ安全な共有を難しくしています。ブラウザだけで全てできれば、と誰もが思うはずです。では次に、その切り札であるWebAssemblyを紹介します。
  s7: SSRとWasmの違いをシーケンス図で比較してみましょう。SSRはループの中にサーバーを置きます。ユーザーがURLを開くと、ブラウザはサーバーへ3Dビューを要求し、サーバーがVTKとGPUでレンダリングして、その画像をブラウザへ返す。毎フレームがネットワーク往復します。一方Wasmはループをブラウザ内で閉じます。ユーザーがURLを開くと、ブラウザ内でVTKパイプラインが実行され、そのまま3Dメッシュがインタラクティブに表示されます。往復が完全に消え、レンダリングはデータが既にある場所で行われます。これがブラウザ完結の本質です。サーバーが要るか要らないか、この違いが全てです。では、このブラウザ完結の流れを詳しく見てみましょう。
  s8: この障壁をすべて一度に取り除くのがWebAssemblyです。WebAssemblyが可視化パイプライン全体をブラウザ内で実行するため、レンダリングサーバーへの往復が消えます。データはどこにも送られず、機密のシミュレーション結果はクライアント側に留まります。そもそも転送するものがありません。プロビジョニングもスケーリングも月々の支払いも不要な、可視化サーバーが要らない状態になります。現場やクライアント先で、ブラウザだけで結果を示せる。URL一つでデリバリーが完結する、それがブラウザ完結の世界です。では、このVTK.wasmがどう生まれてきたか、その歴史を見てみましょう。
  s9: こちらがVTK.wasmのサンプルデモです。完全にブラウザ上で動いています。サーバー不要、インストール不要、ページを開くだけで3Dメッシュが表示され、ドラッグで回転もできます。VTK.wasmは2018年のEmscriptenビルド実験から始まり、2021年に公式ビルドパイプラインへ統合されてnpmで公開されました。2023年から2024年にかけてはWebGPUバックエンドのサポートが進展し、現在はランタイムでWebGLとWebGPUを切替可能で、ブラウザサポートに基づき適切に劣化します。実験から本番へ、技術は着実に成熟しています。今から実際に回してみましょう。ネットワークタブを見れば、サーバーと通信していないのが分かります。完全にクライアント側で完結しています。
  s10: 続いて、完全にブラウザ上で動く5つのライブデモをご覧ください。1つ目はポルシェのCADアセンブリ、マルチアクターとピッキングが動きます。2つ目は手続き型地形、35万1千の三角形をブラウザ内で生成しています。3つ目はスターファイター、グリフとスカラー色、インタラクティブウィジェット付きです。4つ目はボリュームレンダリング、53万1千ボクセルをGPUでレイキャストします。5つ目は1千個以上のアクター、各オブジェクトが独立したvtkActorです。すべてサーバーなしで動いています。ページを開けばそのまま動く、この手軽さがブラウザ完結の強みです。どれもドラッグで回転できます。ぜひ手元で触ってみてください。
  s11: では、このVTK.wasmはどうやってビルドし、どう使うのでしょうか。Emscripten SDKをインストールして有効化し、VTKのC++コードベース全体をWebAssemblyへクロスコンパイルします。このビルドには何時間もかかります。しかし重要なのは、下流の利用者は誰もこのコストを払わないということです。利用者は単にnpm
    installするだけで、数時間のビルドとVTKの30年の機能が、インストール一発で手に入ります。ビルドの重さと利用の軽さが完全に分離されている、これがパッケージ設計の鍵です。次に、このバイナリをどう配布するかを見ます。
  s12: 配布の仕組みも独特です。WASMバイナリはJSパッケージにバンドルせず、実行時にCDNからtarballとしてストリーミングします。開発者がVTK C++をWasmへコンパイルし、WASMバイナリのtarballをCDNへ、JSバインディングをnpmへ公開します。利用者がnpm
    installするとJSバインディングが手元に届き、実行時にcreateNamespace(url)でWASMバイナリがCDNからストリーミングされます。アジアからはKitwareのGitLab直URLが遅いため、jsDelivrのマルチCDNエッジキャッシュを使うことで高速化しています。これで配信の遅さも解消します。npmパッケージは軽く保たれ、初回ロードだけ待てば済みます。二回目以降はキャッシュが効くため、すぐに表示されます。
  s13: ここでPyodideとPyVistaが出会います。PyodideはCPythonをWebAssemblyにコンパイルしたもので、ブラウザ内で本物のCPythonインタープリターが動きます。PyVistaはVTKのPythonicラッパーで、科学者がデスクトップで既に使っているのと同じAPIです。この2つを組み合わせると、ブラウザでPythonを書き、同じページで3Dメッシュを可視化でき、バックエンドはゼロになります。間を埋めるのがpyvista-wasmで、vtk-wasmの上にPyVista風APIを構築しています。TypeScriptがグルー層としてvtk-wasmモジュールをロードし、C++のVTKバインディングをPython向けAPIへ橋渡しします。なお、sys.modulesにpyodideがある場合は、メッシュ取得がurllibの代わりにXMLHttpRequestへフォールバックします。これにより、ブラウザ環境特有の制約を回避しつつ、デスクトップと同じコードがそのまま動きます。次に、この統合で直面した課題と解決策を紹介します。
  s14: vtk.wasmをpyvista-wasmへ統合する過程でいくつか課題に直面しましたが、すべて解決済みです。1つ目、createNamespace()がPromiseを返すため、すべてのVTKオブジェクト操作をawaitしています。2つ目、並列処理フィルターにSharedArrayBufferが必要なため、vite-plugin-cross-origin-isolationでCOOP/COEPヘッダーを注入しています。3つ目、tarballのURLをクロスオリジンで取得するためCORSが必要で、CORSヘッダーを送信するCDNを使っています。4つ目、KitwareのGitLab直URLはアジアで遅いため、jsDelivrのマルチCDNエッジキャッシュに切り替えました。すべて既知の解決策で揃っています。壁に当たっても逃げ道はあります。これが実装面の要点です。次は、いよいよコード比較で直感性を示します。
  s15: コード比較で直感性がよく分かります。左のVTK.wasmはJavaScriptで、球を作り、分解能を設定し、mapperとactorとrendererを順につないでカメラをリセットする、4オブジェクトの完全なパイプラインが必要です。右のpyvista-wasmはPythonで、micropipでインストールし、pv.SphereしてPlotterにadd_meshしてshowする、たった4行です。補足ですが、右側の描画はこのPythonスニペットからエクスポートしたライブなvtk.wasmシーンで、トーク中に実際に掴んで回転できます。同じ結果が、この短さで得られる。これがPyVistaのAPI設計の力です。デスクトップと同じ書き方でブラウザに描画できます。続いて、実際に動くデモを順に見ていきましょう。
  s16: 続いてデモです。JupyterLiteはブラウザだけで動くJupyter環境で、インストールが不要です。用意されたノートブックのセルを1つ実行するだけで、pv.Sphere()やpv.read()で3Dメッシュがインタラクティブに表示されます。ローカルセットアップなしでvtk.wasmのレンダリング品質を体験できる入り口として最適です。GitHub
    Pagesや任意の静的ホストにデプロイ可能で、サーバーは不要です。URLで共有すれば、ワンクリックで再現可能な分析環境が手に入ります。今から実際にこの画面で動かしてみましょう。皆さんも手元で開いて追従できます。最初のデモなので、まずは一番手軽な環境から入ります。
  s17: 次のデモはmarimoです。marimoもブラウザ内で完全に動くリアクティブなPythonノートブックです。最大の違いは、セルの値が変わると依存するセルが自動で再実行される点です。スライダーを動かすとメッシュの色や視点が即座に再描画されます。Jupyterのような手動の再実行ボタンは不要で、依存グラフが実行を自動駆動します。これによりパラメーターのスイープが楽になり、探索的な可視化作業のペースが格段に向上します。URLで共有すれば、ワンクリックでリアクティブな3D探索環境が手に入ります。今からスライダーを触ってみます。色が変わる様子に注目してください。Jupyterにはないこの即時性がmarimoの強みです。
  s18: 3つ目はstliteです。stliteはStreamlitを完全にクライアント側、つまりブラウザ内だけで実行します。サーバー不要、インストール不要で、URLでアプリを共有できます。数行のスライダーとセレクトボックスのコードで、3Dメッシュ可視化のフルインタラクティブなUIが構築できます。こちらのStanford
    Bunnyデモでは、セレクトボックスで8色から色を選び、スライダーで不透明度を0から1まで調整すると、メッシュがライブ更新されます。Streamlitの宣言的UIとpyvista-wasmのレンダリングが組み合わさり、サーバーレスなツールを誰でも使えます。ウィジェット付きアプリが必要な時はstliteが自然な選択です。今から触ってみます。色が切り替わる様子をご覧ください。非エンジニアの同僚にもそのまま渡せる点が大きな利点です。
  s19: APIドキュメントにも工夫があります。すべてのExamples欄に「Try it in JupyterLite!」ボタンを用意しました。クリックすると、pyodideの下でプリアンブルが実行されます。micropipがjinja2とlazy-loaderをインストールし、sys.pathは/drive/srcを指し、import
    pyvista_wasm as pvで準備完了です。訪問者はローカルインストールなしで、ブラウザ内で直接メッシュを描画できます。ドキュメントを読みながらその場で試せる、これがサーバーレスの醍醐味です。今から実際にこの画面でボタンを押して動かしてみましょう。URL一つで試せる手軽さを体感してください。ドキュメントと実行環境が一つにまとまります。これでデモパートは終わりです。
  s20: pyvista-wasmにはCLIも用意しています。pyvista-wasm --helpを実行すると、plot、info、capture-preview、capture-marimo-preview、capture-stlite-preview、export-demo、そしてcheck-locale-parityといったコマンドが並びます。ターミナルからメッシュをプロットし、プレビューGIFをキャプチャし、デモページをエクスポートできます。Pythonコードを書かなくても3D可視化が可能で、コーディングエージェントとの連携も容易になります。実はこのスライドデッキに埋め込んだデモページも、export-demoコマンドで書き出したものです。CIでも同じコマンドが動いています。CLI一つで再現できるのが強みです。続いて、本トークの参考元をご紹介します。
  s21: 本トークの構成は、燈株式会社の技術ブログ記事「vtk.wasmで実現するブラウザ完結3D可視化」にインスピレーションを受けています。サーバーサイドレンダリングから脱する動機、vtk.wasmの背景、JupyterLiteやmarimoやstliteのデモ、ユースケースの議論に至るまで、この記事の構成に沿ってデッキを組みました。より詳しい文脈や背景をお読みになりたい方は、ぜひこちらの記事をご覧ください。QRコードからもアクセスできます。本トークが関心を持つきっかけになれば嬉しいです。日本語で読めるのも魅力です。それでは、ここからデモの続きに移ります。
  s22: PyVistaは、画面に映っているこれだけ多くのコントリビューターによって作られているオープンソースプロジェクトです。そしてpyvista-wasmも、同じ精神で進めています。バグ報告、機能要望、ドキュメントの改善、翻訳、どのような形であれコントリビューションを歓迎します。PyVista本体に比べればまだ小さなプロジェクトですが、だからこそ、皆さんの声が直接未来を形作ります。一緒にブラウザ完結の3D可視化を育てていきましょう。次のスライドで議論の場をご案内します。小さなPRからでも大歓迎です。ぜひ一緒に育ててください。
  s23: 最後までご清聴いただきありがとうございました。本日のスライドとデモはすべて公開しています。質問と議論はGitHub Discussionsで受け付けています。こちらのQRコードをスキャンしていただければ、すぐにスレッドを開けます。今日話せなかった詳細や、試してみたいと思った方のフィードバックも、そちらでお待ちしています。ブラウザさえあればPyVistaが動く、その世界を皆さんと一緒に広げていきたいです。それでは、Q&Aを始めましょう。質問どうぞ。お待ちしています。
  # yamllint enable rule:line-length
