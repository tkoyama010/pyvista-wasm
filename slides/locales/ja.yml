  i4t: OpenGL/Vulkanレンダラー
  i4d: 本番級のGPUパイプライン
  i5t: 豊富なエコシステム
  i5d: PyVista（Pythonラッパー）、ITK（医用画像）、NumPy/SciPy科学スタック
