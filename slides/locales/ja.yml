  i3t: この組み合わせ
  i3d: ブラウザでPythonを書き、同じページで3Dメッシュを可視化、バックエンドゼロ
  i4t: pyvista-wasm
  i4d: vtk-wasmの上に構築されたPyVista風APIでギャップを埋める
  conc_pre: TypeScriptがグルー —
  conc_bold: vtk-wasmをロードし、C++ VTKバインディングをPython向けAPIに橋渡し
  arch_label: 階層アーキテクチャ
  i5t: グルー層
  i5d: TypeScriptがvtk-wasmモジュールをロードし、VTKクラスをPythonに公開
  i6t: ランタイムフォールバック
  i6d_pre: の時、
  i6d_post: メッシュ取得はurllibの代わりにXMLHttpRequestを使用

dev_ci:
  title: vtk.wasmをpyvista-wasmに統合した際には課題が発生したが、全て解決済み
  subtitle: 開発時に発生した問題とその解決策
  col_issue: 問題
  col_solution: 解決策
  p1: createNamespace()がPromiseを返す
  s1: 全てのVTKオブジェクト操作をawaitする
  p2: 並列処理フィルターにSharedArrayBufferが必要
  s2: vite-plugin-cross-origin-isolationでCOOP/COEPヘッダーを注入
  p3: tarball URLをクロスオリジンで取得するためCORSが必要
  s3: CORSヘッダーを送信するCDNを使う
  p4: KitwareのGitLab直URLはアジアで遅い
  s4: jsDelivrのマルチCDNエッジキャッシュを使う

