agenda:
  title: Python×WASMのリアル：重量級ライブラリ移植の壁と、ブラウザ完結型・科学技術計算の未来を語る
  subtitle: アジェンダ
  i1t: PyVistaとWASMの概要
  i1d: なぜブラウザで3D可視化を行うのか
