  subtitle: PyVistaのホームページ
  i1t: VTKを基盤とする
  i1d: KitwareのC++可視化ツールキット、1993年から30年以上の開発の歴史
  i2t: Pythonic API
  i2d: VTKの強力だが冗長なC++コアを直感的な数行でラップ
  i3t: デファクトスタンダード
  i3d: 医用画像、CAE、地球科学、気象学
  i4t: 豊富なエコシステム
  i4d: ITK、NumPy、SciPy
  mesh_caption_pre: PyVistaでレンダリングされた三角3Dメッシュ —
  mesh_caption_bold: ドラッグで回転

problem:
  title: Web上での科学計算の3D計算結果の共有には、サーバーの用意がネックとなる
  subtitle: 課題一覧
  col_issue: 課題
  col_detail: 詳細
  i1t: Three.jsの機能不足
  i1d: 科学技術計算の結果をレンダリングするには機能不足
  i2t: 時間的コスト
  i2d: 専用の可視化サーバーを構築・維持する必要がある
  i3t: 金銭的コスト
  i3d: インフラの構築と運用は継続的な出費
  i4t: セキュリティリスク
  i4d: 機密のシミュレーションデータが分析者のマシンからサーバーへ送信される
  conc_pre: これらの障壁により分析結果の共有が
  conc_bold: 迅速かつ安全に
  conc_post: 行いにくい — ブラウザで全てできれば？

why_wasm:
  title: ブラウザ完結でセキュリティとリソースの問題を解決
  subtitle: ブラウザ完結のシーケンス図
  i1t: データはどこにも送られない
  i1d: WebAssemblyがブラウザ内で可視化パイプライン全体を実行、レンダリングサーバーへの往復が消える
  i2t: データはマシンから出ない
  i2d: 機密のシミュレーション結果はクライアント側に留まり、そもそも転送するものがない
  i3t: インフラ不要
  i3d: プロビジョニング、スケーリング、月々の支払いが不要な可視化サーバーがない
  i4t: これがどこから来たか
  i4d_pre: "物理シミュレーションのプロジェクトが求めた一つの場所:"
  i4d_italic: 解析したメッシュをブラウザにドロップして見る
  i5t: どこでもデモ
  i5d: 現場やクライアント先でブラウザだけで結果を表示
  conc_pre: URLがデリバリーの全て —
  conc_bold: ではPyVistaをどうやってそこに？

arch:
  title: SSRはサーバーでの処理を挟むのに対し、Wasmはブラウザ内で処理を完結できる
  subtitle: "SSR と Wasm のシーケンス図比較"
  conc_pre: 往復が完全に消える —
  conc_bold: レンダリングはデータのある場所で行われる

