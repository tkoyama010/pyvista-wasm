pipeline:
  title: ユーザーはViteの設定で、VTK.wasmが利用可能
  subtitle: ViteにおけるVTK.wasmの利用方法
  i1t: Emscripten
  i1d: VTKのC++コードベース全体をWebAssemblyにコンパイル、30年の機能をブラウザに
  i2t: ビルドは重く、利用は軽く
  i2d: ビルド自体は数時間かかるが、ユーザーは単に
  i3t: 実行時のtarball
  i3d: WASMバイナリはCDNからtarballとしてストリーミング、JSパッケージにバンドルされない
  conc_pre: Vite設定一つで全て解放 —
  conc_bold: ブラウザネイティブVTKまであと2行
  config_label: vite.config.js
  i4t: "build.target: 'esnext'"
  i4d: vtk-wasmは次世代ビルドターゲットが必要なモダンJS機能に依存
  i5t: optimizeDeps.exclude
  i5d: ViteはWASMパッケージを事前バンドルしてはいけない；実行時に非同期ロード

