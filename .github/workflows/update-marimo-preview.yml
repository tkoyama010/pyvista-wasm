---
name: Update marimo Preview GIF
on:
  workflow_dispatch:
  release:
    types: [published]
permissions: {}
jobs:
  update-marimo-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: |
          pip install . playwright "imageio[ffmpeg]" pillow
          playwright install chromium
      - run: python -m pyvista_wasm capture-marimo-preview
      - name: Upload marimo preview GIF to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" assets/marimo-preview.gif --clobber
