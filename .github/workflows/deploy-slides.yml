name: Deploy Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'slides/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-slides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-slides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Install Slidev dependencies
        working-directory: slides
        run: npm ci

      - name: Build Slidev deck
        working-directory: slides
        run: npx slidev build --base /pyvista-wasm/slides/

      - name: Create landing page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>pyvista-wasm — Server-less 3D Visualization</title>
              <style>
                :root { color-scheme: light dark; }
                body {
                  margin: 0;
                  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
                  background: #0f172a;
                  color: #e2e8f0;
                }
                .container { max-width: 640px; padding: 2rem; text-align: center; }
                h1 { font-size: 2rem; margin-bottom: .25rem; }
                .subtitle { font-size: 1.1rem; opacity: .7; margin-bottom: 2rem; }
                .links { display: flex; flex-direction: column; gap: 1rem; }
                .card {
                  display: block; padding: 1.25rem 1.5rem; border-radius: .75rem;
                  background: #1e293b; text-decoration: none; color: #e2e8f0;
                  border: 1px solid rgba(125,125,125,.2); transition: border-color .15s;
                }
                .card:hover { border-color: #38bdf8; }
                .card .title { font-size: 1.1rem; font-weight: 600; }
                .card .desc { font-size: .9rem; opacity: .6; margin-top: .25rem; }
                .footer { margin-top: 2rem; font-size: .85rem; opacity: .5; }
                .footer a { color: #38bdf8; text-decoration: none; }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>PyVista on WebAssembly</h1>
                <div class="subtitle">Server-less 3D Visualization</div>
                <div class="links">
                  <a class="card" href="slides/">
                    <div class="title">Slide Deck</div>
                    <div class="desc">PyCon JP 2026 talk slides — interactive presentation</div>
                  </a>
                  <a class="card" href="https://pyvista-js.readthedocs.io/en/latest/lite/lab/index.html?path=intro.ipynb">
                    <div class="title">JupyterLite (ReadTheDocs)</div>
                    <div class="desc">Try PyVista in the browser — no installation needed</div>
                  </a>
                </div>
                <div class="footer">
                  <a href="https://github.com/tkoyama010/pyvista-wasm">github.com/tkoyama010/pyvista-wasm</a>
                </div>
              </div>
            </body>
          </html>
          EOF

      - name: Deploy landing page to gh-pages root
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true

      - name: Deploy slides to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: slides/dist
          destination_dir: slides
          keep_files: true
