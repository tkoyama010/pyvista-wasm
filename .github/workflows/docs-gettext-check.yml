name: Docs Gettext Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gettext-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[docs]"

      - name: Generate .pot templates
        run: |
          sphinx-build -b gettext docs docs/_build/gettext

      - name: Verify .pot files generated
        run: |
          pot_count=$(find docs/_build/gettext -name "*.pot" | wc -l)
          if [ "$pot_count" -eq 0 ]; then
            echo "::error::No .pot files generated"
            exit 1
          fi
          echo "Generated $pot_count .pot files"
