---
name: Slide Locale Parity Check
on:
  push:
    branches: [main]
    paths:
      - 'slides/locales/ja.yml'
      - 'slides/locales/en.yml'
      - 'slides/locales/script/ja.yml'
      - 'slides/locales/script/en.yml'
      - 'src/pyvista_wasm/_cli.py'
  pull_request:
    branches: [main]
    paths:
      - 'slides/locales/ja.yml'
      - 'slides/locales/en.yml'
      - 'slides/locales/script/ja.yml'
      - 'slides/locales/script/en.yml'
      - 'src/pyvista_wasm/_cli.py'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-locale-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pyvista-wasm
        run: pip install --no-cache-dir .
      - name: Run locale parity check
        run: pyvista-wasm check-locale-parity
      - name: Run speaker script parity check
        run: pyvista-wasm check-locale-parity --ja slides/locales/script/ja.yml --en slides/locales/script/en.yml
