name: Slide Locale Parity Check

on:
  push:
    branches: [main]
    paths:
      - 'slides/locales/ja.yml'
      - 'slides/locales/en.yml'
      - 'slides/locales/script/ja.yml'
      - 'slides/locales/script/en.yml'
      - 'src/pyvista_wasm/_cli.py'
  pull_request:
    branches: [main]
    paths:
      - 'slides/locales/ja.yml'
      - 'slides/locales/en.yml'
      - 'slides/locales/script/ja.yml'
      - 'slides/locales/script/en.yml'
      - 'src/pyvista_wasm/_cli.py'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-locale-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pyvista-wasm
        run: pip install --no-cache-dir .

      - name: Run locale parity check
        run: pyvista-wasm check-locale-parity

      - name: Run speaker script parity check
        run: pyvista-wasm check-locale-parity --ja slides/locales/script/ja.yml --en slides/locales/script/en.yml
