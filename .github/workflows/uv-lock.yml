---
name: Update uv.lock
on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
permissions: {}
jobs:
  uv-lock:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    environment: release-please
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - name: Update uv.lock
        run: uv lock
      - name: Commit uv.lock
        # yamllint disable rule:line-length
        run: |-
          git config user.name "pyvista-bot"
          git config user.email "pyvista-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_PLEASE_TOKEN }}@github.com/${{ github.repository }}.git
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore: update uv.lock"
          git push
        # yamllint enable rule:line-length
